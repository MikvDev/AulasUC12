<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <title>Animações</title>
</head>
<body>
    <main>
        

        <div class="fade-in">
            <p>Conteúdo com Fade In inicial.</p>
            <button style="margin-top: 20px;" class="btn">Clique aqui</button>
        </div>
         <div data-aos="slide-left">
  Este conteúdo aparece com efeito de slide para a esquerda!
</div>
        <div style="height: 50vh;"></div>
        
        <div class="box">
            <section style="width: 200px; height: 200px; background-color: blue; margin: auto;"></section>
        </div>
        <div class="box">
            <section style="width: 200px; height: 200px; background-color: blue; margin: auto;"></section>
        </div>
         <div data-aos="fade-up">
  Este conteúdo aparece com efeito de fade para cima!
</div>
        <div class="box">
            <section style="width: 200px; height: 200px; background-color: blue; margin: auto;"></section>
        </div>

        <div class="pulse" style="width: 100px; height: 100px; background-color: green; margin: 50px auto;"></div>
        
        <div class="spin" style="width: 100px; height: 100px; background-color: yellow; margin: 50px auto;"></div>

        <div style="height: 50vh;"></div>

      
       
    </main>

    <script src="./assets/js/script.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"> </script>
    <script>
        AOS.init();
    </script>
</body>
</html>
